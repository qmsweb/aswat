<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="منصة الصوامت العربية - علم الأصوات">
    <title>{{ page.title | default: "صوامت - منصة الصوامت العربية" }}</title>

    <meta property="og:title" content="{{ page.title | default: 'منصة صوامت' }}" />
    <meta property="og:description" content="منصة الصوامت العربية - علم الأصوات" />
    <meta property="og:image" content="{{ '/images/cover.jpg' | relative_url }}" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="{{ page.url | absolute_url }}" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" href="{{ '/icons/favicon.png' | relative_url }}" type="image/jpg">

    <link rel="stylesheet" href="{{ '/css/style.css' | relative_url }}">

    <style>
        :root {
            --primary-color: #7F288F;
            --primary-hover: #671d75;
            --primary-light: #f6ecf8;
            --bg-color: #ffffff;
            --text-main: #222222;
            --text-muted: #666666;
            --border-color: #e5e5e5;
            --card-bg: #ffffff;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.7;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 20px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        /* === تنسيقات بطاقة الأسئلة التفاعلية === */
        .flashcard-wrapper {
            max-width: 650px;
            width: 100%;
            margin: 0 auto 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .flashcard {
            background-color: transparent;
            perspective: 1000px;
            width: 100%;
            height: 380px;
            cursor: pointer;
            margin-bottom: 30px;
        }

        .flashcard-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
            transform-style: preserve-3d;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }

        .flashcard-inner.flipped {
            transform: rotateY(180deg);
        }

        .flashcard-front,
        .flashcard-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
            border-radius: 20px;
        }

        .flashcard-front {
            background-color: var(--card-bg);
            border: 2px solid var(--border-color);
            color: var(--text-main);
        }

        .flashcard-front h3 {
            color: var(--text-muted);
            font-size: 1.2rem;
            margin-bottom: 25px;
            font-weight: 600;
        }

        .flashcard-front p {
            font-size: 2rem;
            font-weight: 700;
            color: var(--primary-color);
            line-height: 1.5;
        }

        .flashcard-back {
            background: linear-gradient(135deg, var(--primary-color), var(--primary-hover));
            color: #ffffff;
            transform: rotateY(180deg);
            border: 2px solid var(--primary-hover);
        }

        .flashcard-back h3 {
            color: rgba(255, 255, 255, 0.8);
            font-size: 1.2rem;
            margin-bottom: 25px;
            font-weight: 600;
        }

        .flashcard-back p {
            font-size: 2.2rem;
            font-weight: 700;
            line-height: 1.5;
        }

        .click-hint {
            position: absolute;
            bottom: 25px;
            font-size: 0.95rem;
            color: var(--text-muted);
            opacity: 0.7;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .flashcard-back .click-hint {
            color: rgba(255, 255, 255, 0.7);
        }

        .controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 25px;
            width: 100%;
            background: var(--card-bg);
            padding: 15px 30px;
            border-radius: 50px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            border: 1px solid var(--border-color);
        }

        .nav-btn {
            background: var(--primary-light);
            color: var(--primary-color);
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            font-size: 1.2rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .nav-btn:hover:not(:disabled) {
            background: var(--primary-color);
            color: #fff;
            transform: scale(1.05);
        }

        .nav-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            background: #f1f1f1;
            color: #999;
        }

        .card-counter {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--text-main);
            min-width: 80px;
            text-align: center;
        }

        @media (max-width: 768px) {
            .flashcard { height: 300px; }
            .flashcard-front p { font-size: 1.5rem; }
            .flashcard-back p { font-size: 1.6rem; }
        }
    </style>
</head>
<body>

    {% include header.html %}

    <main class="container">

        {{ content }}

        <section class="hero-section">
            <h2 class="hero-title">اختبر معلوماتك</h2>
            <p class="hero-subtitle">انقر على البطاقة لعرض الإجابة الصحيحة.</p>
        </section>

        <div class="flashcard-wrapper">
            <div class="flashcard" onclick="toggleFlip()">
                <div class="flashcard-inner" id="flashcard-inner">
                    <div class="flashcard-front">
                        <h3>السؤال</h3>
                        <p id="question-text">جاري التحميل...</p>
                        <span class="click-hint"><i class="fa-solid fa-hand-pointer"></i> انقر لمعرفة الإجابة</span>
                    </div>
                    <div class="flashcard-back">
                        <h3>الإجابة</h3>
                        <p id="answer-text"></p>
                        <span class="click-hint"><i class="fa-solid fa-rotate-left"></i> انقر للعودة</span>
                    </div>
                </div>
            </div>

            <div class="controls">
                <button class="nav-btn" id="btn-prev" onclick="prevCard()" title="السؤال السابق">
                    <i class="fa-solid fa-chevron-right"></i>
                </button>

                <span class="card-counter" id="card-counter">1 / 10</span>

                <button class="nav-btn" id="btn-next" onclick="nextCard()" title="السؤال التالي">
                    <i class="fa-solid fa-chevron-left"></i>
                </button>
            </div>
        </div>

    </main>

    {% include footer.html %}

    <script>
        // بيانات البطاقات الـ 10
        const flashcardsData = [
            { q: "ما هو مخرج حرف الباء؟", a: "شفوي" },
            { q: "هل حرف السين مجهور أم مهموس؟", a: "مهموس" },
            { q: "اذكر حرفاً من الحروف اللهوية.", a: "حرف القاف" },
            { q: "ما هي طريقة نطق حرف الميم؟", a: "أنفية" },
            { q: "ما هو الحرف الذي يعتبر (شديد رخو) مركب؟", a: "حرف الجيم" },
            { q: "ما هي الحروف المطبقة؟", a: "الصاد، الضاد، الطاء، الظاء" },
            { q: "من أين يخرج حرف الهمزة؟", a: "مخرج حنجري" },
            { q: "ما هما الحرفان الاستمراريان؟", a: "الواو والياء" },
            { q: "ما هي الحروف بين الأسنانية؟", a: "الثاء، الذال، الظاء" },
            { q: "هل حرف الضاد شديد (انفجاري) أم رخو؟", a: "شديد (انفجاري)" }
        ];

        let currentIndex = 0;

        const questionEl = document.getElementById('question-text');
        const answerEl = document.getElementById('answer-text');
        const counterEl = document.getElementById('card-counter');
        const btnPrev = document.getElementById('btn-prev');
        const btnNext = document.getElementById('btn-next');
        const cardInner = document.getElementById('flashcard-inner');

        // تحديث محتوى البطاقة
        function loadCard() {
            if (cardInner) cardInner.classList.remove('flipped');

            setTimeout(() => {
                if (questionEl) questionEl.innerText = flashcardsData[currentIndex].q;
                if (answerEl) answerEl.innerText = flashcardsData[currentIndex].a;
                if (counterEl) counterEl.innerText = `${currentIndex + 1} / ${flashcardsData.length}`;

                if (btnPrev) btnPrev.disabled = currentIndex === 0;
                if (btnNext) btnNext.disabled = currentIndex === flashcardsData.length - 1;
            }, 200);
        }

        // قلب البطاقة
        function toggleFlip() {
            if (cardInner) cardInner.classList.toggle('flipped');
        }

        // البطاقة التالية
        function nextCard() {
            if (currentIndex < flashcardsData.length - 1) {
                currentIndex++;
                loadCard();
            }
        }

        // البطاقة السابقة
        function prevCard() {
            if (currentIndex > 0) {
                currentIndex--;
                loadCard();
            }
        }

        document.addEventListener('DOMContentLoaded', loadCard);
    </script>

    <script src="{{ '/script.js' | relative_url }}"></script>

</body>
</html>
