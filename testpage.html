<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>معمل الصوتيات الافتراضي</title>
    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: #1e1e1e;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 600px;
            text-align: center;
        }
        h2 { margin-top: 0; color: #ffffff; }
        canvas {
            width: 100%;
            height: 200px;
            background: #000000;
            border-radius: 8px;
            margin: 20px 0;
            border: 1px solid #333;
        }
        button {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover { background: #45a049; }
        button.recording { background: #f44336; }
    </style>
</head>
<body>

    <div class="card">
        <h2>تحليل الموجة الصوتية</h2>
        <p>انقر على الزر أدناه وانطق بعض الأصوات العربية (مثل: ضَ - دَ)</p>
        <canvas id="oscilloscope"></canvas>
        <br>
        <button id="toggleMic">بدء التحليل الصوتي</button>
    </div>

    <script>
        const btn = document.getElementById('toggleMic');
        const canvas = document.getElementById('oscilloscope');
        const canvasCtx = canvas.getContext('2d');
        
        let audioCtx;
        let analyser;
        let source;
        let isRecording = false;

        btn.onclick = async () => {
            if (isRecording) {
                audioCtx.close();
                isRecording = false;
                btn.textContent = "بدء التحليل الصوتي";
                btn.classList.remove('recording');
                return;
            }

            try {
                // طلب صلاحية الميكروفون
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioCtx.createAnalyser();
                
                source = audioCtx.createMediaStreamSource(stream);
                source.connect(analyser);
                
                analyser.fftSize = 2048;
                const bufferLength = analyser.frequencyBinCount;
                const dataArray = new Uint8Array(bufferLength);

                isRecording = true;
                btn.textContent = "إيقاف التحليل";
                btn.classList.add('recording');

                // إعداد أبعاد الكانفاس لتجنب التشوه
                canvas.width = canvas.clientWidth;
                canvas.height = canvas.clientHeight;

                function draw() {
                    if (!isRecording) return;
                    requestAnimationFrame(draw);

                    analyser.getByteTimeDomainData(dataArray);

                    canvasCtx.fillStyle = '#000000';
                    canvasCtx.fillRect(0, 0, canvas.width, canvas.height);

                    canvasCtx.lineWidth = 2;
                    canvasCtx.strokeStyle = '#00ffcc';
                    canvasCtx.beginPath();

                    const sliceWidth = canvas.width * 1.0 / bufferLength;
                    let x = 0;

                    for (let i = 0; i < bufferLength; i++) {
                        const v = dataArray[i] / 128.0;
                        const y = v * canvas.height / 2;

                        if (i === 0) {
                            canvasCtx.moveTo(x, y);
                        } else {
                            canvasCtx.lineTo(x, y);
                        }
                        x += sliceWidth;
                    }

                    canvasCtx.lineTo(canvas.width, canvas.height / 2);
                    canvasCtx.stroke();
                }

                draw();

            } catch (err) {
                alert('لم نتمكن من الوصول إلى الميكروفون: ' + err);
            }
        };
    </script>
</body>
</html>
