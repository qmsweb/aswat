<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            text-align: center;
            padding: 30px;
        }
        .lab-container {
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 15px;
            max-width: 700px;
            margin: 0 auto;
            border: 1px solid #333;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .wave-box {
            background-color: #2a2a2a;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
            border: 1px solid #444;
        }
        .wave-title {
            font-size: 14px;
            color: #888;
            margin-bottom: 10px;
            text-align: right;
            font-weight: bold;
        }
        .reference-wave { border-right: 4px solid #4CAF50; } /* أخضر للنموذج */
        .student-wave { border-right: 4px solid #2196F3; }   /* أزرق للطالب */
        
        button {
            padding: 12px 24px;
            margin: 5px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }
        .btn-play { background-color: #4CAF50; color: white; }
        .btn-play:hover { background-color: #45a049; }
        
        .btn-record { background-color: #f44336; color: white; }
        .btn-record:hover { background-color: #da190b; }
        
        .btn-stop { background-color: #ff9800; color: white; display: none; }
    </style>
</head>
<body>

    <div class="lab-container">
        <h2 style="color: #fff;">مختبر الاستطالة: حرف (الضاد)</h2>
        <p style="color: #aaa; margin-bottom: 30px;">استمع لنطق الأستاذ، ثم سجل صوتك وحاول مطابقة زمن الاستطالة بصرياً.</p>

        <!-- موجة الأستاذ (المرجع) -->
        <div class="wave-box reference-wave">
            <div class="wave-title">🔊 النطق المعياري (الأستاذ)</div>
            <div id="teacher-waveform"></div>
            <button class="btn-play" id="playTeacherBtn">▶️ استماع للنموذج</button>
        </div>

        <!-- موجة الطالب -->
        <div class="wave-box student-wave">
            <div class="wave-title">🎤 نطقك (الطالب)</div>
            <div id="student-waveform"></div>
            <div style="margin-top: 15px;">
                <button class="btn-record" id="recordBtn">🔴 بدء المحاكاة</button>
                <button class="btn-stop" id="stopBtn">⏹️ إيقاف التسجيل</button>
                <button class="btn-play" id="playStudentBtn" style="display: none;">▶️ استماع لنطقك</button>
            </div>
        </div>
    </div>

    <!-- المكتبات -->
    <script src="https://unpkg.com/wavesurfer.js@7"></script>
    <script src="https://unpkg.com/wavesurfer.js@7/dist/plugins/record.min.js"></script>

    <script>
        // 1. إعداد موجة الأستاذ (ملف صوتي مسجل مسبقاً)
        const teacherWave = WaveSurfer.create({
            container: '#teacher-waveform',
            waveColor: '#4CAF50',
            progressColor: '#2E7D32',
            barWidth: 3,
            height: 80,
            url: 'https://www.w3schools.com/html/horse.ogg' // استبدله بملف صوتي لحرف الضاد
        });

        document.getElementById('playTeacherBtn').addEventListener('click', () => {
            teacherWave.playPause();
        });

        // 2. إعداد موجة الطالب (للتسجيل المباشر)
        const studentWave = WaveSurfer.create({
            container: '#student-waveform',
            waveColor: '#2196F3',
            progressColor: '#1565C0',
            barWidth: 3,
            height: 80
        });

        const recordPlugin = studentWave.registerPlugin(WaveSurfer.Record.create({
            scrollingWaveform: true,
            renderRecordedAudio: true
        }));

        // أزرار الطالب
        const recordBtn = document.getElementById('recordBtn');
        const stopBtn = document.getElementById('stopBtn');
        const playStudentBtn = document.getElementById('playStudentBtn');

        recordBtn.addEventListener('click', () => {
            recordPlugin.startRecording();
            recordBtn.style.display = 'none';
            playStudentBtn.style.display = 'none';
            stopBtn.style.display = 'inline-block';
        });

        stopBtn.addEventListener('click', () => {
            recordPlugin.stopRecording();
            stopBtn.style.display = 'none';
            recordBtn.style.display = 'inline-block';
            recordBtn.innerText = '🔄 إعادة المحاولة';
            playStudentBtn.style.display = 'inline-block';
        });

        playStudentBtn.addEventListener('click', () => {
            studentWave.playPause();
        });
    </script>
</body>
</html>
