<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>معمل الصوتيات الافتراضي</title>
    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .card {
            background: #1e1e1e;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 700px;
            text-align: center;
        }
        h2 { margin-top: 0; color: #ffffff; }
        .canvas-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin: 20px 0;
        }
        .label {
            text-align: right;
            font-size: 14px;
            color: #aaaaaa;
            margin-bottom: -5px;
        }
        canvas {
            width: 100%;
            height: 180px;
            background: #000000;
            border-radius: 8px;
            border: 1px solid #333;
        }
        button {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
            width: 100%;
            max-width: 300px;
        }
        button:hover { background: #45a049; }
        button.recording { background: #f44336; }
    </style>
</head>
<body>

    <div class="card">
        <h2>معمل الصوتيات الافتراضي (نسخة الويب)</h2>
        <p>انقر على الزر أدناه وانطق الأصوات لمشاهدة الموجة والمخطط الطيفي.</p>
        
        <div class="canvas-container">
            <div class="label">الموجة الصوتية (Waveform): قياس الشدة والزمن</div>
            <canvas id="oscilloscope"></canvas>
            
            <div class="label">المخطط الطيفي (Spectrogram): قياس الترددات (Formants)</div>
            <canvas id="spectrogram"></canvas>
        </div>

        <button id="toggleMic">بدء التحليل الصوتي</button>
    </div>

    <script>
        const btn = document.getElementById('toggleMic');
        
        // إعداد كانفاس الموجة
        const canvasOsc = document.getElementById('oscilloscope');
        const ctxOsc = canvasOsc.getContext('2d');
        
        // إعداد كانفاس الطيف (مع willReadFrequently لتحسين أداء النسخ والإزاحة)
        const canvasSpec = document.getElementById('spectrogram');
        const ctxSpec = canvasSpec.getContext('2d', { willReadFrequently: true });
        
        let audioCtx;
        let analyser;
        let source;
        let isRecording = false;
        let animationId;

        btn.onclick = async () => {
            if (isRecording) {
                // إيقاف التسجيل
                cancelAnimationFrame(animationId);
                audioCtx.close();
                isRecording = false;
                btn.textContent = "بدء التحليل الصوتي";
                btn.classList.remove('recording');
                return;
            }

            try {
                // طلب الصلاحية وبدء الميكروفون
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioCtx.createAnalyser();
                
                source = audioCtx.createMediaStreamSource(stream);
                source.connect(analyser);
                
                // دقة التحليل (fftSize) - كلما زادت زادت دقة الترددات
                analyser.fftSize = 2048; 
                
                // مصفوفات البيانات
                const bufferLengthOsc = analyser.frequencyBinCount;
                const dataArrayOsc = new Uint8Array(bufferLengthOsc);
                
                const bufferLengthSpec = analyser.frequencyBinCount;
                const dataArraySpec = new Uint8Array(bufferLengthSpec);

                isRecording = true;
                btn.textContent = "إيقاف التحليل";
                btn.classList.add('recording');

                // ضبط أبعاد الكانفاس لتتطابق مع العرض الفعلي
                canvasOsc.width = canvasOsc.clientWidth;
                canvasOsc.height = canvasOsc.clientHeight;
                canvasSpec.width = canvasSpec.clientWidth;
                canvasSpec.height = canvasSpec.clientHeight;

                // سرعة تحرك المخطط الطيفي
                const scrollSpeed = 2; 

                function draw() {
                    if (!isRecording) return;
                    animationId = requestAnimationFrame(draw);

                    // ==========================================
                    // 1. رسم الموجة الصوتية (Oscilloscope)
                    // ==========================================
                    analyser.getByteTimeDomainData(dataArrayOsc);

                    ctxOsc.fillStyle = '#000000';
                    ctxOsc.fillRect(0, 0, canvasOsc.width, canvasOsc.height);

                    ctxOsc.lineWidth = 2;
                    ctxOsc.strokeStyle = '#00ffcc'; // لون الموجة
                    ctxOsc.beginPath();

                    const sliceWidth = canvasOsc.width * 1.0 / bufferLengthOsc;
                    let x = 0;

                    for (let i = 0; i < bufferLengthOsc; i++) {
                        const v = dataArrayOsc[i] / 128.0;
                        const y = v * canvasOsc.height / 2;

                        if (i === 0) {
                            ctxOsc.moveTo(x, y);
                        } else {
                            ctxOsc.lineTo(x, y);
                        }
                        x += sliceWidth;
                    }
                    ctxOsc.lineTo(canvasOsc.width, canvasOsc.height / 2);
                    ctxOsc.stroke();

                    // ==========================================
                    // 2. رسم المخطط الطيفي (Spectrogram)
                    // ==========================================
                    analyser.getByteFrequencyData(dataArraySpec);

                    // إزاحة اللوحة الحالية لليسار لخلق تأثير الحركة
                    ctxSpec.drawImage(canvasSpec, -scrollSpeed, 0);

                    // نأخذ فقط النصف السفلي من الترددات (حوالي 0 إلى 5500 هرتز) 
                    // لأن معظم خصائص الكلام البشري تقع في هذا النطاق
                    const usefulBins = Math.floor(bufferLengthSpec * 0.5);
                    const h = canvasSpec.height / usefulBins;

                    for (let i = 0; i < usefulBins; i++) {
                        // البيانات تأتي من التردد المنخفض للمرتفع
                        const value = dataArraySpec[i]; 
                        const percent = value / 255;
                        
                        // تلوين حراري داكن (أسود -> أزرق داكن -> سيان لامع)
                        const r = Math.floor(percent * 30);
                        const g = Math.floor(percent * 255);
                        const b = Math.floor(percent * 200);
                        
                        ctxSpec.fillStyle = `rgb(${r}, ${g}, ${b})`;
                        
                        // رسم العمود الجديد على الحافة اليمنى
                        // نقوم بعكس المحور الصادي ليكون التردد المنخفض بالأسفل
                        const y = canvasSpec.height - (i * h) - h;
                        
                        ctxSpec.fillRect(canvasSpec.width - scrollSpeed, y, scrollSpeed, h);
                    }
                }

                draw();

            } catch (err) {
                alert('حدث خطأ في الوصول للميكروفون: ' + err);
            }
        };
    </script>
</body>
</html>
