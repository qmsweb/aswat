<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="شارك أداة صوامت بسهولة عبر رمز الاستجابة السريعة (QR Code).">
    <title>{{ page.title }}</title>

    <meta property="og:title" content="{{ page.title }}" />
    <meta property="og:description" content="شارك أداة صوامت بسهولة عبر رمز الاستجابة السريعة (QR Code)." />
    <meta property="og:image" content="{{ '/images/cover.jpg' | relative_url }}" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="{{ page.url | absolute_url }}" />

    <link rel="preload" href="{{ '/fonts/thmanyahsans-Regular.otf' | relative_url }}" as="font" type="font/otf" crossorigin>
    <link rel="preload" href="{{ '/fonts/thmanyahsans-Bold.otf' | relative_url }}" as="font" type="font/otf" crossorigin>
    <link rel="stylesheet" href="{{ '/css/fonts.css' | relative_url }}">
    <link rel="icon" href="{{ '/icons/favicon.png' | relative_url }}" type="image/jpg">

    <link rel="stylesheet" href="{{ '/css/style.css' | relative_url }}">

    <style>
        :root {
            --primary-color: #9e37b0;
            --primary-hover: #671d75;
            --primary-light: #f6ecf8;
            --bg-color: #ffffff;
            --text-main: #222222;
            --text-muted: #666666;
            --border-color: #e5e5e5;
            --card-bg: #ffffff;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.7;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 20px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .container > #main-content-area {
            flex: 1;
            display: flex;
            align-items: center;
        }

        /* === قسم الـ QR Code === */
        .qr-section {
            text-align: center;
            padding: 60px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
        }
        .qr-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.03);
        }
        .qr-title {
            font-size: 2rem;
            font-weight: 700;
            color: var(--primary-color);
            margin-top: 0;
            margin-bottom: 10px;
        }
        .qr-subtitle {
            font-size: 1.1rem;
            color: var(--text-muted);
            margin-bottom: 30px;
        }

        .qr-image-wrapper {
            background-color: #ffffff;
            padding: 15px;
            border-radius: 12px;
            border: 2px dashed var(--border-color);
            display: inline-block;
            margin-bottom: 25px;
            transition: all 0.3s ease;
        }
        .qr-image-wrapper:hover {
            border-color: var(--primary-color);
            transform: scale(1.02);
        }
        .qr-image {
            width: 200px;
            height: 200px;
            display: block;
        }

        .qr-url {
            display: inline-block;
            background: var(--primary-light);
            color: var(--primary-color);
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1.1rem;
            direction: ltr;
            margin-bottom: 30px;
            word-break: break-all;
            width: 100%;
        }

        .action-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-family: 'Thmanyah', 'Segoe UI', Tahoma, sans-serif;
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(127, 40, 143, 0.2);
            width: 100%;
        }
        .action-btn:hover {
            background-color: var(--primary-hover);
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(127, 40, 143, 0.3);
        }

        @media (max-width: 768px) {
            .qr-card {
                padding: 30px 20px;
                border: none;
                box-shadow: none;
                border-radius: 0;
            }
            .qr-title {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>

    {% include header.html %}

    <main class="container">

        <div id="main-content-area">
            <section class="qr-section">
                <div class="qr-card">
                    <h1 class="qr-title">مشاركة موقع صوامت</h1>
                    <p class="qr-subtitle">امسح الرمز أدناه للوصول السريع إلى صوامت من أي جهاز</p>

                    <div class="qr-image-wrapper">
                        <img src="https://api.qrserver.com/v1/create-qr-code/?size=400x400&data=https://sawamet.jassim.one/&margin=0" alt="رمز QR لموقع صوامت" class="qr-image" loading="lazy">
                    </div>

                    <div class="qr-url">https://sawamet.jassim.one</div>

                    <a href="https://api.qrserver.com/v1/create-qr-code/?size=1000x1000&data=https://sawamet.jassim.one/&margin=20" download="sawamet-qr" target="_blank" class="action-btn">
                        حفظ الرمز كصورة
                    </a>
                </div>
            </section>
        </div>

    </main>

    {% include lite-footer.html %}

    <script src="{{ '/script.js' | relative_url }}"></script>

</body>
</html>
