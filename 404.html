<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="عذراً، الصفحة التي تبحث عنها غير موجودة.">
    <title>{{ page.title }}</title>

    <meta property="og:title" content="{{ page.title }}" />
    <meta property="og:description" content="عذراً، الصفحة التي تبحث عنها غير موجودة." />
    <meta property="og:image" content="{{ '/images/cover.jpg' | relative_url }}" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="{{ page.url | absolute_url }}" />

    <link rel="preload" href="{{ '/fonts/thmanyahsans-Regular.otf' | relative_url }}" as="font" type="font/otf" crossorigin>
    <link rel="preload" href="{{ '/fonts/thmanyahsans-Bold.otf' | relative_url }}" as="font" type="font/otf" crossorigin>
    <link rel="stylesheet" href="{{ '/css/fonts.css' | relative_url }}">
    <link rel="icon" href="{{ '/icons/favicon.png' | relative_url }}" type="image/jpg">

    <link rel="stylesheet" href="{{ '/css/style.css' | relative_url }}">

    <style>
        :root {
            --primary-color: #9e37b0;
            --primary-hover: #671d75;
            --primary-light: #f6ecf8;
            --bg-color: #ffffff;
            --text-main: #222222;
            --text-muted: #666666;
            --border-color: #e5e5e5;
            --card-bg: #ffffff;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.7;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 20px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        /* === قسم الخطأ 404 === */
        .error-section {
            text-align: center;
            padding: 100px 20px;
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .error-code {
            font-size: 8rem;
            font-weight: 700;
            color: var(--primary-color);
            margin: 0;
            line-height: 1;
            text-shadow: 4px 4px 0px var(--primary-light);
        }
        .error-title {
            font-size: 2rem;
            font-weight: 700;
            color: var(--text-main);
            margin: 20px 0 10px;
        }
        .error-subtitle {
            font-size: 1.1rem;
            color: var(--text-muted);
            margin-bottom: 40px;
            max-width: 500px;
        }
        .action-btn {
            display: inline-block;
            font-family: 'Thmanyah', 'Segoe UI', Tahoma, sans-serif;
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 35px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(127, 40, 143, 0.2);
        }
        .action-btn:hover {
            background-color: var(--primary-hover);
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(127, 40, 143, 0.3);
        }

        @media (max-width: 768px) {
            .error-code { font-size: 6rem; }
            .error-title { font-size: 1.6rem; }
        }
    </style>
</head>
<body>

    {% include header.html %}

    <main class="container">

        <div id="main-content-area">
            <section class="error-section">
                <h1 class="error-code">404</h1>
                <h2 class="error-title">الصفحة غير موجودة</h2>
                <p class="error-subtitle">عذراً، يبدو أن الصفحة التي تحاول الوصول إليها قد تم نقلها، حذفها، أو أنها لم تكن موجودة من الأساس.</p>

                <a href="{{ '/' | relative_url }}" class="action-btn">العودة للصفحة الرئيسة</a>
            </section>
        </div>

    </main>

    {% include footer.html %}

    <script src="{{ '/script.js' | relative_url }}"></script>

</body>
</html>
